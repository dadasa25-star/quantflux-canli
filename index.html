/* ============ YARDIMCILAR ============ */
function $(id){return document.getElementById(id)}
function norm(s){
  s=String(s).replace(/İ/g,"i").replace(/I/g,"ı").toLocaleLowerCase("tr");
  s=s.replace(/ı/g,"i").replace(/ş/g,"s").replace(/ğ/g,"g").replace(/ü/g,"u").replace(/ö/g,"o").replace(/ç/g,"c").replace(/[âä]/g,"a").replace(/î/g,"i").replace(/û/g,"u").replace(/i̇/g,"i");
  return " "+s.replace(/[^a-z0-9]+/g," ").trim()+" ";
}
function isCorrect(comment,answers){
  var c=norm(comment);
  for(var i=0;i<answers.length;i++){var a=norm(answers[i]);if(a.trim()&&c.indexOf(a)!==-1)return true}
  return false;
}
function shuffle(arr){for(var i=arr.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=arr[i];arr[i]=arr[j];arr[j]=t}return arr}

/* ============ ÖLÇEKLEME ============ */
var stage=$("stage");
function fit(){var s=Math.min(innerWidth/1080,innerHeight/1920);stage.style.transform="translate(-50%,-50%) scale("+s+")"}
addEventListener("resize",fit);fit();

/* ============ ARKA PLAN: 3D IZGARA + PARTİKÜL ============ */
var bg=$("bg"),bx=bg.getContext("2d"),W=1080,H=1920;
var parts=[];for(var i=0;i<90;i++)parts.push({x:Math.random()*W,y:Math.random()*H,r:2+Math.random()*5,v:.3+Math.random()*1.1,ph:Math.random()*6.28,c:Math.random()<.5?"255,201,51":"0,229,255"});
function drawBg(t){
  var g=bx.createLinearGradient(0,0,0,H);g.addColorStop(0,"#060b19");g.addColorStop(.5,"#120a35");g.addColorStop(1,"#060b19");
  bx.fillStyle=g;bx.fillRect(0,0,W,H);
  var hz=H/2,off=(t/1800)%1;
  bx.lineWidth=2;
  for(var side=-1;side<=1;side+=2){
    for(var k=0;k<22;k++){
      var p=((k+off)/22),y=hz+side*(p*p*hz);
      bx.strokeStyle="rgba("+(side>0?"0,229,255":"168,85,247")+","+(.06+p*.45)+")";
      bx.beginPath();bx.moveTo(0,y);bx.lineTo(W,y);bx.stroke();
    }
    for(var v=-14;v<=14;v++){
      bx.strokeStyle="rgba(124,58,237,.38)";
      bx.beginPath();bx.moveTo(W/2+v*36,hz);bx.lineTo(W/2+v*330,hz+side*hz);bx.stroke();
    }
  }
  var hg=bx.createRadialGradient(W/2,hz,10,W/2,hz,500);hg.addColorStop(0,"rgba(124,58,237,.35)");hg.addColorStop(1,"rgba(124,58,237,0)");
  bx.fillStyle=hg;bx.fillRect(0,hz-500,W,1000);
  for(var n=0;n<parts.length;n++){
    var q=parts[n];q.y-=q.v;q.x+=Math.sin(t/900+q.ph)*.5;
    if(q.y<-10){q.y=H+10;q.x=Math.random()*W}
    var a=.35+.35*Math.sin(t/500+q.ph);
    bx.fillStyle="rgba("+q.c+","+a+")";bx.shadowColor="rgb("+q.c+")";bx.shadowBlur=14;
    bx.beginPath();bx.arc(q.x,q.y,q.r,0,6.283);bx.fill();
  }
  bx.shadowBlur=0;
}

/* ============ KONFETİ ============ */
var fx=$("fx"),fc=fx.getContext("2d"),conf=[];
function burst(){
  var cols=["#ffc933","#00e5ff","#a855f7","#3dff8f","#ff4d6d","#ffffff"];
  for(var i=0;i<220;i++){
    var left=i%2===0;
    conf.push({x:left?0:W,y:900+Math.random()*300,vx:(left?1:-1)*(8+Math.random()*16),vy:-(14+Math.random()*20),g:.55,w:10+Math.random()*14,h:6+Math.random()*10,r:Math.random()*6,vr:(Math.random()-.5)*.5,c:cols[i%cols.length],life:240});
  }
}
function drawConf(){
  fc.clearRect(0,0,W,H);
  for(var i=conf.length-1;i>=0;i--){
    var p=conf[i];p.vy+=p.g;p.vx*=.992;p.x+=p.vx;p.y+=p.vy;p.r+=p.vr;p.life--;
    if(p.life<=0||p.y>H+40){conf.splice(i,1);continue}
    fc.save();fc.translate(p.x,p.y);fc.rotate(p.r);fc.fillStyle=p.c;fc.globalAlpha=Math.min(1,p.life/60);fc.fillRect(-p.w/2,-p.h/2,p.w,p.h);fc.restore();
  }
}

/* ============ AVATAR ============ */
var mouth=$("mouth"),bars=[];
for(var b=0;b<9;b++){
  var r=document.createElementNS("http://www.w3.org/2000/svg","rect");
  r.setAttribute("x",b*17.5);r.setAttribute("width",11);r.setAttribute("rx",5);r.setAttribute("fill","#00e5ff");
  mouth.appendChild(r);bars.push(r);
}
var speaking=false,mood="neutral";
var MOODS={neutral:"#00e5ff",happy:"#3dff8f",sad:"#ff3b5c"};
function setMood(m){
  mood=m;var c=MOODS[m];
  ["eL","eR","ant","core"].forEach(function(id){$(id).setAttribute("fill",c)});
  bars.forEach(function(r){r.setAttribute("fill",c)});
  $("head").setAttribute("stroke",c);
  var h=$("host");h.classList.remove("happy","sad");void h.getBBox;
  if(m==="happy")h.classList.add("happy");if(m==="sad")h.classList.add("sad");
}
function animMouth(t){
  for(var i=0;i<bars.length;i++){
    var amp=(speaking||audioSpeaking)?(10+Math.abs(Math.sin(t/90+i*1.3))*30*(.5+.5*Math.sin(t/140+i))):(mood==="sad"?4:5+Math.sin(t/600+i)*2);
    var hh=Math.max(4,amp);bars[i].setAttribute("height",hh);bars[i].setAttribute("y",(20-hh/2)+(mood==="sad"?8:0));
  }
}

/* ============ SESLENDİRME ============ */
var voice=null,soundOn=true;
function pickVoice(){
  var vs=speechSynthesis.getVoices();if(!vs.length)return;
  var tr=vs.filter(function(v){return /^tr([-_]|$)/i.test(v.lang)||/turk|türk/i.test(v.name)});
  voice=tr.filter(function(v){return /ahmet/i.test(v.name)&&/online/i.test(v.name)})[0]
     ||tr.filter(function(v){return /online|natural/i.test(v.name)})[0]
     ||tr.filter(function(v){return /ahmet|emel|tolga/i.test(v.name)})[0]
     ||tr[0]||null;
  $("tInfo").textContent="Ses: "+(voice?voice.name:"tr-TR bulunamadı (varsayılan)");
}
if("speechSynthesis" in window){pickVoice();speechSynthesis.onvoiceschanged=pickVoice}
var spkCount=0,audioSpeaking=false,invAudio=null,invIdx=0;
var INVITES=["./davet1.m4a","./davet2.m4a","./davet3.m4a","./davet4.m4a"];
function stopInvite(){
  if(invAudio){var a=invAudio;invAudio=null;a.onended=a.onerror=null;try{a.pause()}catch(e){}}
  audioSpeaking=false;
}
function playInvite(msg,done){
  stopInvite();
  if(!soundOn){if(done)done();return}
  try{if("speechSynthesis" in window)speechSynthesis.cancel()}catch(e){}
  var a=new Audio(INVITES[invIdx%INVITES.length]);invIdx++;invAudio=a;
  var finished=false;
  function fin(ok){
    if(finished)return;finished=true;
    if(invAudio===a){invAudio=null;audioSpeaking=false}
    if(!ok&&invAudio===null&&soundOn)speak(msg,{cancel:true}); // dosya yoksa/çalmazsa yedek: tarayıcı sesi
    if(done)done();
  }
  a.onplaying=function(){audioSpeaking=true};
  a.onended=function(){fin(true)};
  a.onerror=function(){fin(false)};
  var p;try{p=a.play()}catch(e){fin(false);return}
  if(p&&p.catch)p.catch(function(){fin(false)});
}
function speak(text,opt){
  opt=opt||{};
  if(!soundOn||!("speechSynthesis" in window))return;
  try{
    if(opt.cancel)speechSynthesis.cancel();
    var u=new SpeechSynthesisUtterance(text);
    u.lang="tr-TR";if(voice)u.voice=voice;
    u.rate=opt.rate||1.02;u.pitch=opt.pitch||1.05;u.volume=1;
    u.onstart=function(){spkCount++;speaking=true};
    u.onend=u.onerror=function(){spkCount=Math.max(0,spkCount-1);if(!spkCount)speaking=false};
    speechSynthesis.speak(u);
  }catch(e){}
}

/* ============ OYUN DURUMU ============ */
var TOTAL=45,HINT1=25,HINT2=12;
var deck=[],lastIdx=-1,qCount=0,cur=null,phase="idle",tStart=0,answered=false;
var hintMask=[],hintOrder=[],hint1Done=false,hint2Done=false,nextTimer=null,lowerTimer=null;
var scores={};try{scores=JSON.parse(localStorage.getItem("qf_scores")||"{}")}catch(e){scores={}}

function nextQuestion(){
  if(!deck.length){
    deck=shuffle(QUESTIONS.map(function(_,i){return i}));
    if(deck[deck.length-1]===lastIdx&&deck.length>1){var t=deck[0];deck[0]=deck[deck.length-1];deck[deck.length-1]=t}
  }
  var idx=deck.pop();lastIdx=idx;return QUESTIONS[idx];
}
function renderHint(){
  var ans=cur.a[0].toLocaleUpperCase("tr"),out="";
  for(var i=0;i<ans.length;i++){
    var ch=ans[i];
    if(ch===" ")out+="  ";else out+=(hintMask[i]?ch:"_")+" ";
  }
  $("hint").textContent=out.trim();
  $("hint").style.fontSize=(out.length>22?48:out.length>14?60:74)+"px";
}
function revealLetter(){
  if(!cur)return;
  for(var i=0;i<hintOrder.length;i++){if(!hintMask[hintOrder[i]]){hintMask[hintOrder[i]]=true;break}}
  renderHint();
}
function startQuestion(){
  clearTimeout(nextTimer);
  $("winner").classList.remove("show");$("timeup").classList.remove("show");
  cur=nextQuestion();qCount++;answered=false;phase="ask";tStart=performance.now();
  hint1Done=hint2Done=false;setMood("neutral");
  var ans=cur.a[0];hintMask=[];hintOrder=[];
  for(var i=0;i<ans.length;i++){hintMask.push(false);if(ans[i]!==" ")hintOrder.push(i)}
  shuffle(hintOrder);
  $("cat").textContent=cur.cat+"  •  #"+qCount;
  $("qbox").textContent=cur.q;
  $("qbox").style.fontSize=(cur.q.length>70?50:58)+"px";
  renderHint();
  stopInvite();
  var invite=(qCount%3===0);
  if(invite){var qq=cur;showInvite(function(){if(cur===qq&&phase==="ask")speak(qq.q)})}
  else speak(cur.q,{cancel:true});
}
function showInvite(done){
  var msg="Yayına yeni katılan arkadaşlar hepiniz hoş geldiniz, cevabı yoruma yazın adınızı okuyalım!";
  $("lowertxt").textContent="📢 "+msg;
  $("lower").classList.add("show");
  clearTimeout(lowerTimer);lowerTimer=setTimeout(function(){$("lower").classList.remove("show")},9000);
  playInvite(msg,done);
}
function onCorrect(name,uid){
  answered=true;phase="result";stopInvite();
  var key=uid||name;
  if(!scores[key])scores[key]={name:name,pts:0};
  scores[key].name=name;scores[key].pts+=10;
  try{localStorage.setItem("qf_scores",JSON.stringify(scores))}catch(e){}
  renderBoard();
  var ans=cur.a[0];
  hintMask=hintMask.map(function(){return true});renderHint();
  setMood("happy");
  $("wn").textContent=name;$("wa").textContent="Cevap: "+ans;
  $("wn").style.fontSize=(name.length>14?64:100)+"px";
  $("winner").classList.remove("show");void $("winner").offsetWidth;$("winner").classList.add("show");
  burst();
  speak("Harikasın "+name+", doğru cevap "+ans+"!",{cancel:true,rate:.98,pitch:1.15});
  nextTimer=setTimeout(startQuestion,6000);
}
function onTimeUp(){
  answered=true;phase="result";stopInvite();
  hintMask=hintMask.map(function(){return true});renderHint();
  setMood("sad");
  $("ta").textContent="Doğru cevap: "+cur.a[0];
  $("timeup").classList.add("show");
  speak("Süre doldu! Doğru cevap "+cur.a[0]+".",{cancel:true,pitch:.95});
  nextTimer=setTimeout(startQuestion,5000);
}
function renderBoard(){
  var list=Object.keys(scores).map(function(k){return scores[k]}).sort(function(a,b){return b.pts-a.pts}).slice(0,5);
  var box=$("rows");
  if(!list.length){box.innerHTML='<div class="empty">İlk doğru cevabı sen ver, tabloya gir!</div>';return}
  box.innerHTML="";
  list.forEach(function(p,i){
    var d=document.createElement("div");d.className="row"+(i===0?" first":"");
    var medals=["🥇","🥈","🥉"];
    var rk=document.createElement("span");rk.className="rk";rk.textContent=medals[i]||(i+1)+".";
    var nm=document.createElement("span");nm.className="nm";nm.textContent=p.name;
    var pt=document.createElement("span");pt.className="pt";pt.textContent=p.pts+" P";
    d.appendChild(rk);d.appendChild(nm);d.appendChild(pt);box.appendChild(d);
  });
}
function handleComment(name,uid,text){
  if(phase!=="ask"||answered||!cur||!text)return;
  if(isCorrect(text,cur.a))onCorrect(name||"Yarışmacı",uid);
}

/* ============ ANA DÖNGÜ ============ */
var CIRC=553;
function frame(t){
  drawBg(t);drawConf();animMouth(t);
  if(phase==="ask"){
    var el=(performance.now()-tStart)/1000,rem=Math.max(0,TOTAL-el);
    var shown=Math.ceil(rem);
    $("tnum").textContent=shown;
    $("ring").setAttribute("stroke-dashoffset",(CIRC*(1-rem/TOTAL)).toFixed(1));
    var col=rem<=10?"#ff4d6d":rem<=20?"#ffc933":"#00e5ff";
    $("ring").setAttribute("stroke",col);$("tnum").style.color=rem<=10?"#ff9aae":"#fff";
    if(!hint1Done&&rem<=HINT1){hint1Done=true;revealLetter()}
    if(!hint2Done&&rem<=HINT2){hint2Done=true;revealLetter()}
    if(rem<=0&&!answered)onTimeUp();
  }
  requestAnimationFrame(frame);
}

/* ============ TIKFINITY WEBSOCKET ============ */
var ws=null;
function setWs(on){var e=$("ws");e.className=on?"on":"off";e.textContent=on?"● TikFinity BAĞLI":"● TikFinity bekleniyor"}
function connect(){
  try{ws=new WebSocket("ws://localhost:21213/")}catch(e){setWs(false);setTimeout(connect,3000);return}
  ws.onopen=function(){setWs(true)};
  ws.onclose=function(){setWs(false);setTimeout(connect,3000)};
  ws.onerror=function(){try{ws.close()}catch(e){}};
  ws.onmessage=function(m){
    try{
      var j=JSON.parse(m.data),ev=j.event||j.type||"",d=j.data||j;
      if(ev&&ev!=="chat"&&ev!=="comment")return;
      var text=d.comment||d.message||d.text;
      if(!text)return;
      handleComment(d.nickname||d.uniqueId||d.username||"Yarışmacı",d.uniqueId||d.userId||d.nickname,text);
    }catch(e){}
  };
}

/* ============ TEST PANELİ (H) ============ */
addEventListener("keydown",function(e){
  if(e.target&&/INPUT|TEXTAREA/.test(e.target.tagName))return;
  if(e.key==="h"||e.key==="H"||e.code==="KeyH"){var t=$("test"),open=t.style.display!=="block";t.style.display=open?"block":"none"}
});
function sendTest(){
  var n=$("tName").value.trim()||"Test",m=$("tMsg").value;
  handleComment(n,"test_"+n,m);$("tMsg").value="";
}
$("tSend").onclick=sendTest;
$("tMsg").addEventListener("keydown",function(e){if(e.key==="Enter")sendTest()});
$("tSnd").onclick=function(){
  soundOn=!soundOn;this.textContent=soundOn?"🔊 Ses: Açık":"🔇 Ses: Kapalı";
  if(!soundOn){stopInvite();if("speechSynthesis" in window)speechSynthesis.cancel()}
};
$("tSkip").onclick=function(){if(phase==="ask"&&!answered)onTimeUp()};

/* ============ OTOMATİK BAŞLAT ============ */
renderBoard();setMood("neutral");connect();
requestAnimationFrame(frame);
startQuestion();
})();
</script>
